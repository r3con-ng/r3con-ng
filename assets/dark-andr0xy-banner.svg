<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DARK ANDR0XY — Cybersecurity</title>
  <desc id="desc">Animated terminal-inspired cyber banner with neon green scan line, network nodes, and a pulsing security target.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/><stop offset="1" stop-color="#101c20"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
